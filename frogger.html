<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>กบหนีเที่ยว</title>
<style>
  html, body { margin: 0; height: 100%; background: #14181d; display: flex; align-items: center; justify-content: center; font-family: Tahoma, sans-serif; }
  canvas { background: #000; max-width: 100vw; max-height: 100vh; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="480" height="560"></canvas>
<script>
const TILE = 40, COLS = 12, ROWS = 13, HUD = 40, W = 480, H = HUD + ROWS * TILE;
const SLOTS = [1, 4, 7, 10];
const CAR_COLORS = ['#e74c3c', '#f1c40f', '#ecf0f1', '#9b59b6', '#e67e22'];
const LIFE_TIME = 30;

// row 1-5 = river (logs), row 7-11 = road (cars)
const LANE_DEFS = [
  { row: 1, dir: -1, speed: 1.0, water: true, w: [2, 3], gap: [1.5, 2.5] },
  { row: 2, dir: 1, speed: 0.7, water: true, w: [2, 4], gap: [1.5, 3] },
  { row: 3, dir: -1, speed: 1.4, water: true, w: [1.5, 3], gap: [2, 3] },
  { row: 4, dir: 1, speed: 1.0, water: true, w: [2, 3], gap: [1.5, 2.5] },
  { row: 5, dir: -1, speed: 0.6, water: true, w: [3, 4], gap: [2, 3] },
  { row: 7, dir: 1, speed: 1.2, water: false, w: [1, 2], gap: [2, 4] },
  { row: 8, dir: -1, speed: 1.8, water: false, w: [1, 1.5], gap: [2.5, 4] },
  { row: 9, dir: 1, speed: 0.9, water: false, w: [1.5, 2], gap: [2, 3] },
  { row: 10, dir: -1, speed: 1.5, water: false, w: [1, 1], gap: [2, 3.5] },
  { row: 11, dir: 1, speed: 2.0, water: false, w: [1, 1.5], gap: [3, 5] },
];

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let lanes, frog, lives, score, level, levelMul, filled, gameOver;

const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

function stepLane(L, dt, mul) {
  const v = L.dir * L.speed * mul * dt;
  for (const o of L.objs) o.x += v;
  L.objs = L.objs.filter(o => o.x < COLS + 1 && o.x + o.w > -1);

  // spawn a new object at the entry edge once there is room for the gap
  if (L.dir > 0) {
    const minX = L.objs.length ? Math.min(...L.objs.map(o => o.x)) : Infinity;
    if (minX >= L.nextGap) {
      const w = rnd(...L.w);
      const color = L.water ? '#8b5a2b' : CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
      L.objs.push({ x: -w, w, color });
      L.nextGap = rnd(...L.gap);
    }
  } else {
    const maxR = L.objs.length ? Math.max(...L.objs.map(o => o.x + o.w)) : -Infinity;
    if (COLS - maxR >= L.nextGap) {
      const w = rnd(...L.w);
      const color = L.water ? '#8b5a2b' : CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)];
      L.objs.push({ x: COLS, w, color });
      L.nextGap = rnd(...L.gap);
    }
  }
}

function resetLanes() {
  lanes = LANE_DEFS.map(d => ({ ...d, objs: [], nextGap: 0 }));
  // fast-forward so the river and road are already populated
  for (let i = 0; i < 400; i++) lanes.forEach(L => stepLane(L, 0.05, 1));
}

function resetFrog() {
  frog = { x: 5, row: ROWS - 1, best: ROWS - 1, time: LIFE_TIME, dead: 0 };
}

function restart() {
  lives = 3;
  score = 0;
  level = 1;
  levelMul = 1;
  filled = SLOTS.map(() => false);
  gameOver = false;
  resetLanes();
  resetFrog();
}

function die() {
  if (frog.dead > 0) return;
  frog.dead = 1;
  lives--;
  if (lives <= 0) gameOver = true;
}

function reachGoal() {
  const i = SLOTS.indexOf(frog.x);
  if (i < 0 || filled[i]) return die();

  filled[i] = true;
  score += 50 + Math.round(frog.time) * 10;
  if (filled.every(Boolean)) {
    level++;
    levelMul *= 1.15;
    score += 500;
    filled = SLOTS.map(() => false);
  }
  resetFrog();
}

function hop(dx, dy) {
  if (gameOver || frog.dead > 0) return;
  frog.x = Math.round(frog.x);
  frog.x = clamp(frog.x + dx, 0, COLS - 1);
  if (dy < 0 && frog.row > 0) frog.row--;
  if (dy > 0 && frog.row < ROWS - 1) frog.row++;
  if (frog.row < frog.best) {
    score += 10;
    frog.best = frog.row;
  }
  if (frog.row === 0) reachGoal();
}

function update(dt) {
  if (gameOver) return;
  lanes.forEach(L => stepLane(L, dt, levelMul));

  if (frog.dead > 0) {
    frog.dead -= dt;
    if (frog.dead <= 0) {
      frog.dead = 0;
      if (lives > 0) resetFrog();
    }
    return;
  }

  frog.time -= dt;
  if (frog.time <= 0) return die();

  const L = lanes.find(l => l.row === frog.row);
  if (L && L.water) {
    const c = frog.x + 0.5;
    const log = L.objs.find(o => c >= o.x && c <= o.x + o.w);
    if (!log) return die();
    frog.x += L.dir * L.speed * levelMul * dt; // ride the log
  } else if (L) {
    for (const o of L.objs) {
      if (frog.x + 0.15 < o.x + o.w && frog.x + 0.85 > o.x) return die();
    }
  }

  if (frog.x < -0.5 || frog.x > COLS - 0.5) die();
}

// ---------- drawing ----------
function rect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}

function drawFrog(cx, cy) {
  ctx.fillStyle = '#7ed957';
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(cx - 7, cy - 8, 5, 0, Math.PI * 2);
  ctx.arc(cx + 7, cy - 8, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(cx - 7, cy - 9, 2, 0, Math.PI * 2);
  ctx.arc(cx + 7, cy - 9, 2, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  rect(0, 0, W, H, '#000');

  // rows
  for (let r = 0; r < ROWS; r++) {
    const y = HUD + r * TILE;
    let color = '#2e8b3e';
    if (r === 0) color = '#1e5b2e';
    else if (r <= 5) color = '#1f6fb2';
    else if (r <= 11 && r !== 6) color = '#3a3f47';
    rect(0, y, W, TILE, color);
  }

  // goal slots
  SLOTS.forEach((col, i) => {
    const x = col * TILE, y = HUD;
    rect(x + 4, y + 4, TILE - 8, TILE - 8, '#0d2a14');
    if (filled[i]) drawFrog(x + TILE / 2, y + TILE / 2);
  });

  // road dashes
  ctx.setLineDash([16, 16]);
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  for (let r = 7; r <= 10; r++) {
    const y = HUD + r * TILE + TILE - 1;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  // logs and cars
  for (const L of lanes) {
    const y = HUD + L.row * TILE;
    for (const o of L.objs) {
      const x = o.x * TILE, w = o.w * TILE;
      if (L.water) {
        rect(x + 2, y + 5, w - 4, TILE - 10, o.color);
        rect(x + 6, y + TILE / 2 - 1, w - 12, 2, '#6b4422');
      } else {
        rect(x + 3, y + 6, w - 6, TILE - 12, o.color);
        rect(x + 7, y + 11, w - 14, 8, 'rgba(20,30,40,0.7)');
        rect(L.dir > 0 ? x + w - 6 : x + 3, y + 12, 3, 6, '#fff7b0');
      }
    }
  }

  // HUD
  ctx.fillStyle = '#fff';
  ctx.font = '16px Tahoma, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.fillText(`คะแนน ${score}`, 10, 20);
  ctx.fillText(`ด่าน ${level}`, 190, 20);
  ctx.fillText(`ชีวิต ${'♥'.repeat(Math.max(0, lives))}`, 320, 20);
  rect(0, HUD - 5, W * clamp(frog.time / LIFE_TIME, 0, 1), 4, frog.time > 10 ? '#2ecc71' : '#e74c3c');

  // frog
  if (frog.dead > 0) {
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 4;
    const cx = frog.x * TILE + TILE / 2, cy = HUD + frog.row * TILE + TILE / 2;
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy - 12); ctx.lineTo(cx + 12, cy + 12);
    ctx.moveTo(cx + 12, cy - 12); ctx.lineTo(cx - 12, cy + 12);
    ctx.stroke();
  } else if (!gameOver) {
    drawFrog(frog.x * TILE + TILE / 2, HUD + frog.row * TILE + TILE / 2);
  }

  // game over overlay
  if (gameOver) {
    rect(0, 0, W, H, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px Tahoma, sans-serif';
    ctx.fillText('เกมจบ', W / 2, H / 2 - 30);
    ctx.font = '18px Tahoma, sans-serif';
    ctx.fillText(`คะแนนรวม ${score}`, W / 2, H / 2 + 5);
    ctx.fillText('กด Enter หรือแตะเพื่อเล่นใหม่', W / 2, H / 2 + 40);
    ctx.textAlign = 'left';
  }
}

// ---------- input ----------
const KEYS = {
  arrowup: [0, -1], w: [0, -1],
  arrowdown: [0, 1], s: [0, 1],
  arrowleft: [-1, 0], a: [-1, 0],
  arrowright: [1, 0], d: [1, 0],
};

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    if (gameOver) restart();
    return;
  }
  const m = KEYS[e.key.toLowerCase()];
  if (m) {
    e.preventDefault();
    if (!e.repeat) hop(m[0], m[1]);
  }
});

let touchX = 0, touchY = 0;
canvas.addEventListener('touchstart', e => {
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, { passive: true });

canvas.addEventListener('touchend', e => {
  if (gameOver) return restart();
  const t = e.changedTouches[0];
  const dx = t.clientX - touchX, dy = t.clientY - touchY;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 15) return hop(0, -1); // tap = forward
  if (Math.abs(dx) > Math.abs(dy)) hop(Math.sign(dx), 0);
  else hop(0, Math.sign(dy));
});

// ---------- main loop ----------
restart();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
